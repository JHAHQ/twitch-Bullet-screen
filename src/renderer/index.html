<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Twitch 彈幕控制台 v2.2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <main class="controls" v-show="!isMinimized" ref="panel" :style="{ left: panelPos.x + 'px', top: panelPos.y + 'px' }">
            <div class="drag-header" @mousedown="startDrag">
                <div style="display: flex; align-items: center; font-weight: bold;">
                    <i class="fab fa-twitch" style="margin-right: 5px; color: #9147ff;"></i> 
                    {{ t.ui.panelTitle }} <span :class="['status-dot', wsStatus]"></span>
                    <img v-if="channelAvatar" :src="channelAvatar" class="avatar-preview">
                </div>
                
                <div class="window-controls">
                    <button @click.stop="toggleSettings" class="win-btn" :class="{ active: showSettings }">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button @click.stop="minimizeWindow" class="win-btn">
                        <i class="fas fa-minus"></i>
                    </button>
                    <button @click.stop="closeWindow" class="win-btn close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <div class="control-content">
                <transition name="slide-fade">
                    <div v-if="showSettings" class="settings-overlay" @mousedown.stop>
                        <div class="settings-sidebar">
                            <div class="sidebar-item" :class="{ active: currentTab === 'lang' }" @click="currentTab = 'lang'">
                                <i class="fas fa-globe"></i>
                            </div>
                            <div class="sidebar-item" :class="{ active: currentTab === 'about' }" @click="currentTab = 'about'">
                                <i class="fas fa-info-circle"></i>
                            </div>
                        </div>
                        <div class="settings-main">
                            <div v-if="currentTab === 'lang'" class="tab-content">
                                <label class="tab-title">{{ t.ui.language }}</label>
                                <div class="lang-option" v-for="(name, code) in langNames" :key="code" @click="settings.lang = code">
                                    <span class="lang-text">{{ name }}</span>
                                    <i v-show="settings.lang === code" class="fas fa-check check-mark"></i>
                                </div>
                            </div>
                            <div v-if="currentTab === 'about'" class="tab-content">
                                <label class="tab-title">About</label>
                                <div class="about-info">
                                    <p>Version: {{ version }}</p>
                                    <p>© 2026 {{ author }}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </transition>

                <div class="setting-item">
                    <label>{{ t.ui.channel }}: {{ wsStatusText }}</label>
                    <div class="flex-row">
                        <input type="text" v-model="channelName" :placeholder="t.ui.placeholderID" @keyup.enter="connectTwitch">
                        <button @click="connectTwitch">{{ t.ui.connect }}</button>
                    </div>
                </div>

                <div class="setting-item">
                    <label>{{ t.ui.speed }}: {{ settings.speed }}s | {{ t.ui.fontSize }}: {{ settings.fontSize }}px</label>
                    <input type="range" v-model="settings.speed" min="3" max="15">
                    <input type="range" v-model="settings.fontSize" min="16" max="60">
                </div>

                <div class="setting-item">
                    <label>{{ t.ui.region }}: {{ t.regions[settings.region] }}</label>
                    <select v-model="settings.region">
                        <option value="full">{{ t.regions.full }}</option>
                        <option value="top">{{ t.regions.top }}</option>
                        <option value="center">{{ t.regions.center }}</option>
                        <option value="bottom">{{ t.regions.bottom }}</option>
                    </select>
                </div>

                <div class="setting-item" style="margin-top: 15px; border-top: 1px solid #303032; padding-top: 10px;">
                    <label style="color: #bf94ff;"><i class="fas fa-filter"></i> {{ t.ui.filter }}</label>
                    <div class="flex-row">
                        <input type="text" v-model="filterInput" :placeholder="t.ui.placeholderFilter" @input="updateFilterList">
                    </div>
                </div>
            </div>
        </main>

        <div v-if="isMinimized" @click="restoreWindow" @mousedown="startDrag" class="restore-btn" ref="miniBtn" :style="{ left: panelPos.x + 'px', top: panelPos.y + 'px' }">
            <i class="fab fa-twitch" style="color: white; font-size: 20px;"></i>
        </div>

        <div id="danmu-layer">
            <div v-for="msg in messages" :key="msg.id" class="danmu" :style="genDanmuStyle(msg)">
                <span style="color:#bf94ff">{{ msg.user }}:</span>
                <span>{{ msg.text }}</span>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
